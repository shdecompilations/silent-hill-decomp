name: Credits roll overlay (STF_ROLL)
sha1: 945894dd9496923a8bf1915cc619fc9faad71df3
options:
  basename: STF_ROLL.BIN
  target_path: assets/EUR/VIN/STF_ROLL.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/EUR/screens/stf_roll
  src_path: src/screens/stf_roll
  asset_path: asm/EUR/screens/stf_roll
  build_path: build/EUR

  ld_script_path: linkers/EUR/screens/stf_roll.ld

  find_file_boundaries: False
  gp_value: 0x800236B4
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/EUR/screens/sym.stf_roll.txt
    - configs/EUR/sym.bodyprog.txt
    - configs/EUR/sym.main.txt
  reloc_addrs_path:
    - configs/EUR/screens/rel.stf_roll.txt

  undefined_funcs_auto_path: linkers/EUR/screens/undefined_funcs_auto.stf_roll.txt
  undefined_syms_auto_path: linkers/EUR/screens/undefined_syms_auto.stf_roll.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: stf_roll
    type: code
    start: 0
    vram: 0x801E2600
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, pad]
      - [0x8, .rodata, credits]

      # .text section
      - [0x82C, c, credits]

      # .data section
      - [0x2F60, .data, credits]

  # Random garbage data at end, define as bin file to make Splat ignore it.
  - name: footer_data
    type: bin
    start: 0x3A18
  - [0x3B00]
