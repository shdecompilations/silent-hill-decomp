name: The MAP2_S01 map overlay (MAP2_S01)
sha1: f0b0d121b897f27d7f42e447d38465202ccf039f
options:
  basename: MAP2_S01.BIN
  target_path: assets/JAP1/VIN/MAP2_S01.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP1/maps/map2_s01
  src_path: src/maps/map2_s01
  asset_path: asm/JAP1/maps/map2_s01
  build_path: build/JAP1

  ld_script_path: linkers/JAP1/maps/map2_s01.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP1/maps/sym.map2_s01.txt
  reloc_addrs_path:
    - configs/JAP1/maps/rel.map2_s01.txt

  undefined_funcs_auto_path: linkers/JAP1/maps/undefined_funcs_auto.map2_s01.txt
  undefined_syms_auto_path: linkers/JAP1/maps/undefined_syms_auto.map2_s01.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map2_s01
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map2_s01_2]

      # .text section
      - [0x1A00, c, map2_s01_anim_info]
      - [0x1A00, c, header]
      - [0x1A00, c, map2_s01_2]

      # .data section
      - [0x66D0, .data, map2_s01_anim_info]
      - [0x67DC, data] # TODO: Dahlia anim info, other data
      - [0x6B8C, .data, header]
      - [0x6CEC, .data, map2_s01_2]

      # .bss section
      - [0x6F28, .bss, map2_s01_2]

  # Zero padding at the end of the file.
  - name: footer_data
    type: bin
    start: 0x8220
  - [0x8300]
