name: The MAP1_S04 map overlay (MAP1_S04)
sha1: 51BA2FDBBBD30B90B4414671F1F2D622E38131B8
options:
  basename: MAP1_S04.BIN
  target_path: assets/JAP1/VIN/MAP1_S04.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP1/maps/map1_s04
  src_path: src/maps/map1_s04
  asset_path: asm/JAP1/maps/map1_s04
  build_path: build/JAP1

  ld_script_path: linkers/JAP1/maps/map1_s04.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP1/maps/sym.map1_s04.txt
  reloc_addrs_path:
    - configs/JAP1/maps/rel.map1_s04.txt

  undefined_funcs_auto_path: linkers/JAP1/maps/undefined_funcs_auto.map1_s04.txt
  undefined_syms_auto_path: linkers/JAP1/maps/undefined_syms_auto.map1_s04.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map1_s04
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map1_s04]

      # .text section
      - [0x13B0, c, map1_s04_anim_info]
      - [0x13B0, c, header]
      - [0x13B0, c, map1_s04]

      # .data section
      - [0x3904, .data, map1_s04_anim_info]
      - [0x3970, .data, header]
      - [0x3A28, .data, map1_s04]

      # .bss section
      - [0x41BC, .bss, map1_s04]

  # Garbage data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0x4AA4
  - [0x4B00]
