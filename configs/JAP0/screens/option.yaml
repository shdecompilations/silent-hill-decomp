name: Options screen overlay (OPTION)
sha1: 518E7B61ADD5602E1C9719B597EAA02CD832B6B6
options:
  basename: OPTION.BIN
  target_path: assets/JAP0/VIN/OPTION.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP0/screens/option
  src_path: src/screens/option
  asset_path: asm/JAP0/screens/option
  build_path: build/JAP0

  ld_script_path: linkers/JAP0/screens/option.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/JAP0/screens/sym.option.txt
    - configs/JAP0/sym.bodyprog.txt
    - configs/USA/sym.main.txt
  reloc_addrs_path:
    - configs/JAP0/screens/rel.option.txt

  undefined_funcs_auto_path: linkers/JAP0/screens/undefined_funcs_auto.option.txt
  undefined_syms_auto_path: linkers/JAP0/screens/undefined_syms_auto.option.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: option
    type: code
    start: 0
    vram: 0x801E2600
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, .rodata, options]

      # .text section
      - [0xB64, c, options]

      # .data section
      - [0x5FDC, .data, options]
      - [0x609C, .bss, options]

  # Random garbage data at end, define as bin file to make Splat ignore it.
  - name: footer_data
    type: bin
    start: 0x60DC
  - [0x6100]