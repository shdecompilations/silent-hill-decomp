name: The MAP5_S03 map overlay (MAP5_S03)
sha1: 3c5d8da58cd77143c9e530970a0ff67dd84083c0
options:
  basename: MAP5_S03.BIN
  target_path: assets/JAP0/VIN/MAP5_S03.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP0/maps/map5_s03
  src_path: src/maps/map5_s03
  build_path: build/JAP0

  ld_script_path: linkers/JAP0/maps/map5_s03.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP0/sym.bodyprog.txt
    - configs/JAP0/maps/sym.map5_s03.txt
  reloc_addrs_path:
    - configs/JAP0/maps/rel.map5_s03.txt

  undefined_funcs_auto_path: linkers/JAP0/maps/undefined_funcs_auto.map5_s03.txt
  undefined_syms_auto_path: linkers/JAP0/maps/undefined_syms_auto.map5_s03.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map5_s03
    type: code
    start: 0
    vram: 0x800CBAA8
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map5_s03_2]

      # .text section
      - [0x2294, c, map5_s03_anim_info]
      - [0x2294, c, header]
      - [0x2294, c, map_events]
      - [0x2294, c, map5_s03_2]

      # .data section
      - [0x9A30, .data, map5_s03_anim_info]
      - [0x9CCC, data]
      - [0xA028, .data, header]
      - [0xA244, .data, map5_s03_2]
      - [0xA34C, .data, map_events]
      - [0xA574, data]
  - [0xDB00]
