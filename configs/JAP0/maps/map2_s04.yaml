name: The MAP2_S04 map overlay (MAP2_S04)
sha1: bbfb65b9383d1cdd73550f7030a476d267e22725
options:
  basename: MAP2_S04.BIN
  target_path: assets/JAP0/VIN/MAP2_S04.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP0/maps/map2_s04
  src_path: src/maps/map2_s04
  asset_path: asm/JAP0/maps/map2_s04
  build_path: build/JAP0

  ld_script_path: linkers/JAP0/maps/map2_s04.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP0/sym.bodyprog.txt
    - configs/JAP0/maps/sym.map2_s04.txt
  reloc_addrs_path:
    - configs/JAP0/maps/rel.map2_s04.txt

  undefined_funcs_auto_path: linkers/JAP0/maps/undefined_funcs_auto.map2_s04.txt
  undefined_syms_auto_path: linkers/JAP0/maps/undefined_syms_auto.map2_s04.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map2_s04
    type: code
    start: 0
    vram: 0x800CBAA8
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map2_s04]

      # .text section
      - [0x15FC, c, map2_s04_anim_info]
      - [0x15FC, c, header]
      - [0x15FC, c, map2_s04]

      # .data section
      - [0x450C, .data, map2_s04_anim_info]
      - [0x4690, data]
      - [0x46F8, .data, header]
      - [0x4898, .data, map2_s04]

      # .bss section
      - [0x4ADC, .bss, map2_s04]

  # Stale data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0x5DC4
  - [0x5E00]
