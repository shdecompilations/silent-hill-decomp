name: The MAP2_S03 map overlay (MAP2_S03)
sha1: 7008b0194487248ae199448f90a8376304e19c06
options:
  basename: MAP2_S03.BIN
  target_path: assets/JAP2/VIN/MAP2_S03.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP2/maps/map2_s03
  src_path: src/maps/map2_s03
  asset_path: asm/JAP2/maps/map2_s03
  build_path: build/JAP2

  ld_script_path: linkers/JAP2/maps/map2_s03.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP2/maps/sym.map2_s03.txt
  reloc_addrs_path:
    - configs/JAP2/maps/rel.map2_s03.txt

  undefined_funcs_auto_path: linkers/JAP2/maps/undefined_funcs_auto.map2_s03.txt
  undefined_syms_auto_path: linkers/JAP2/maps/undefined_syms_auto.map2_s03.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map2_s03
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map2_s03]

      # .text section
      - [0x1358, c, map2_s03_anim_info]
      - [0x1358, c, header]
      - [0x1358, c, map2_s03]

      # .data section
      - [0x3590, .data, map2_s03_anim_info]
      - [0x3604, data]
      - [0x3708, .data, header]
      - [0x3728, .data, map2_s03]

      # .bss section
      - [0x3780, .bss, map2_s03]

  # Garbage data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0x48E8
  - [0x4900]
