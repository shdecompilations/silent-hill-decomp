name: The MAP6_S05 map overlay (MAP6_S05)
sha1: 9d3c91bad4ee636c2a04c6de200c30ef0b31c8ac
options:
  basename: MAP6_S05.BIN
  target_path: assets/JAP2/VIN/MAP6_S05.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP2/maps/map6_s05
  src_path: src/maps/map6_s05
  asset_path: asm/JAP2/maps/map6_s05
  build_path: build/JAP2

  ld_script_path: linkers/JAP2/maps/map6_s05.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP2/maps/sym.map6_s05.txt
  reloc_addrs_path:
    - configs/JAP2/maps/rel.map6_s05.txt

  undefined_funcs_auto_path: linkers/JAP2/maps/undefined_funcs_auto.map6_s05.txt
  undefined_syms_auto_path: linkers/JAP2/maps/undefined_syms_auto.map6_s05.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map6_s05
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map6_s05]

      - [0x133C, c, header]
      - [0x133C, c, map6_s05_anim_info]
      # .text section
      - [0x133C, c, map6_s05]

      # .data section
      - [0x3658, .data, map6_s05_anim_info]
      - [0x36A8, data]
      - [0x36F0, .data, header]
      - [0x3710, .data, map6_s05]

      # .bss section
      - [0x375C, .bss, map6_s05]

  # Garbage data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0x4034
  - [0x4100]
