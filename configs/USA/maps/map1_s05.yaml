name: The MAP1_S05 map overlay (MAP1_S05)
sha1: 9ef2c38d11b229648a12ef5d730a02ee6f21635d
options:
  basename: MAP1_S05.BIN
  target_path: assets/USA/VIN/MAP1_S05.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/USA/maps/map1_s05
  src_path: src/maps/map1_s05
  asset_path: asm/USA/maps/map1_s05
  build_path: build/USA

  ld_script_path: linkers/USA/maps/map1_s05.ld

  find_file_boundaries: false
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: false
  use_legacy_include_asm: false

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.bodyprog.txt
    - configs/USA/maps/sym.map1_s05.txt
  reloc_addrs_path:
    - configs/USA/maps/rel.map1_s05.txt

  undefined_funcs_auto_path: linkers/USA/maps/undefined_funcs_auto.map1_s05.txt
  undefined_syms_auto_path: linkers/USA/maps/undefined_syms_auto.map1_s05.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map1_s05
    type: code
    start: 0
    vram: 0x800C9578
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map1_s05]

      - [0x1558, c, header]
      - [0x1558, c, map_events]
      - [0x1558, c, map1_s05_anim_info]
      # .text section
      - [0x1558, c, map1_s05]

      # .data section
      - [0xC10C, .data, map1_s05_anim_info]
      - [0xC27C, data]
      - [0xC6CC, .data, header]
      - [0xC704, .data, map_events]
      - [0xC734, .data, map1_s05]

      # .bss section
      - [0xC770, .bss, map1_s05]

  # Garbage data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0xF188
  - [0xF200]
