name: The MAP2_S04 map overlay (MAP2_S04)
sha1: 6b6108eb4bcdd30e484aeb00910c47953f552bec
options:
  basename: MAP2_S04.BIN
  target_path: assets/USA/VIN/MAP2_S04.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/USA/maps/map2_s04
  src_path: src/maps/map2_s04
  asset_path: asm/USA/maps/map2_s04
  build_path: build/USA

  ld_script_path: linkers/USA/maps/map2_s04.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/USA/sym.bodyprog.txt
    - configs/USA/maps/sym.map2_s04.txt
  reloc_addrs_path:
    - configs/USA/maps/rel.map2_s04.txt

  undefined_funcs_auto_path: linkers/USA/maps/undefined_funcs_auto.map2_s04.txt
  undefined_syms_auto_path: linkers/USA/maps/undefined_syms_auto.map2_s04.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map2_s04
    type: code
    start: 0
    vram: 0x800C9578
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, header]
      - [0x1050, .rodata, map2_s04]

      # .text section
      - [0x1654, c, map2_s04_anim_info]
      - [0x1654, c, header]
      - [0x1654, c, map2_s04]

      # .data section
      - [0x4564, .data, map2_s04_anim_info]
      - [0x46E8, data]
      - [0x4750, .data, header]
      - [0x48F0, .data, map2_s04]

      # .bss section
      - [0x4B38, .bss, map2_s04]

  # Stale data left at the end of the file.
  - name: footer_data
    type: bin
    start: 0x5E20
  - [0x5F00]
