name: Main Game Logic Overlay (BODYPROG)
sha1: eb118537b0c3c1e5cccfa2c5d283b3119c5ec7a3
options:
  basename: BODYPROG.BIN
  target_path: assets/USA/1ST/BODYPROG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/USA/bodyprog
  src_path: src/bodyprog
  o_path: ../../lib
  asset_path: asm/USA/bodyprog
  build_path: build/USA
  hasm_in_src_path: True

  ld_script_path: linkers/USA/bodyprog.ld

  #generate_asm_macros_files: False
  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".sdata", ".bss"]

  symbol_addrs_path:
    - configs/USA/screens/sym.b_konami.txt
    - configs/USA/screens/sym.stream.txt
    - configs/USA/screens/sym.saveload.txt
    - configs/USA/screens/sym.options.txt
    - configs/USA/screens/sym.credits.txt
    - configs/USA/sym.bodyprog.txt
    - configs/USA/sym.main.txt
  reloc_addrs_path:
    - configs/USA/rel.bodyprog.txt

  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.bodyprog.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.bodyprog.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
