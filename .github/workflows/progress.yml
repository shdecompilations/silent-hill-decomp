name: Determine and Push Progress

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.ksy'

jobs:
  build:
    if: github.repository == 'shdecompilations/silent-hill-decomp'

    container: ghcr.io/shdecompilations/decomp-images-silent-hill:master

    strategy:
      fail-fast: false
      matrix:
        include:
          - { game_id: SLPM-86192, version: JAP0 }
          - { game_id: SLUS-00707, version: USA }
          - { game_id: SLPM-86498, version: JAP1 }
          - { game_id: SLES-01514, version: EUR }
          - { game_id: SLPM-87029, version: JAP2 }

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: "Install Extra Dependencies"
        run: apt-get install -y binutils-mipsel-linux-gnu

      - name: "Setup Python"
        run: pip3 install -r requirements.txt --break-system-packages

      - name: "Copy Binaries"
        run: |
          mkdir -p assets rom
          cp -r -p /files/assets/${{ matrix.version }} assets/
          cp -r -p /files/rom/${{ matrix.version }} rom/

      - name: Generate Progress Report
        run: make GAME_VERSION=${{ matrix.version }} report-ci

      - name: Upload Progress Report
        uses: actions/upload-artifact@v7
        with:
            name: ${{ matrix.game_id }}_report
            path: ./build/${{ matrix.version }}/progress.json
